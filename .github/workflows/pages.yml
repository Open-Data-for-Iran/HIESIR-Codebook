# Test, build the documentation site (docs/ + the explorer and CSVs from output/)
# and publish it to GitHub Pages.
# One-time setup on GitHub: Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Download the questionnaire PDFs (release "questionnaires", checked against data/pdfs.csv)
        # without the PDFs the extraction tests skip, so on main that is an error;
        # a pull request only warns
        run: |
          if ! uv run hiesir-codebook pdfs download; then
            if [ "${{ github.event_name }}" = pull_request ]; then
              echo "::warning::no 'questionnaires' release with PDFs; extraction is not tested and the site is built without them"
            else
              echo "::error::no 'questionnaires' release with PDFs; the extraction cannot be tested"
              exit 1
            fi
          fi
      - name: Tests (output/ and the explorer must be up to date; with the PDFs, 1_extracted/ too)
        run: uv run --group docs pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Build the site
        env:
          HIESIR_PDF_DIR: data/pdf
        run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
