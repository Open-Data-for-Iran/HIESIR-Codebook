[project]
name = "hiesir-codebook"
version = "0.1.0"
description = "The questionnaires of the Household Income and Expenditure Survey of Iran (HIES) as a codebook: items extracted from the PDF forms, corrected, and matched across years"
readme = "README.md"
authors = [
    { name = "Mohammad Amin Alavian", email = "m.amin.alavian@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "cyclopts>=5.5.2",
    "fonttools>=4.68.0",
    "polars>=2.1.0",
    "pymupdf>=2.1",
    "xlsxwriter>=3.3.4",
]

[project.urls]
Homepage = "https://open-data-for-iran.github.io/HIESIR-Codebook/"
Repository = "https://github.com/Open-Data-for-Iran/HIESIR-Codebook"

[project.scripts]
hiesir-codebook = "hiesir_codebook:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.2",  # notebooks for drafts (*_draft.py); not needed by the package
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
docs = [
    "mkdocs-material>=9.8.1",
    "mkdocs-static-i18n>=1.3.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Persian text legitimately contains characters ruff flags as "ambiguous"
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: re-extracts every PDF (needs data/); skip with -m 'not slow'"]
