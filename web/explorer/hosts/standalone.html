<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIESIR Codebook Explorer</title>
<meta name="description" content="Search the HIES expenditure questionnaire items 1383-1403 and see how each changed over the years.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<style>
:root { color-scheme: light; --page: #f7f7f5; --bar: #ffffff; --bar-ink: #1d1f23; --bar-line: #e3e3df; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page: #15171a; --bar: #1d2024; --bar-ink: #e8e9eb; --bar-line: #30343a; } }
:root[data-theme="dark"] { color-scheme: dark; --page: #15171a; --bar: #1d2024; --bar-ink: #e8e9eb; --bar-line: #30343a; }
html, body { margin: 0; }
body { background: var(--page); color: var(--bar-ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Vazirmatn, sans-serif; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--bar-line); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; }
.spacer { flex: 1; }
.top a, .top button { color: inherit; opacity: .75; background: none; border: 1px solid var(--bar-line); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; text-decoration: none; }
.top a:hover, .top button:hover { opacity: 1; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
.hx-standalone { --sticky-top: 66px; }
/*__CSS__*/
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand" id="brand">HIESIR Codebook</div>
    <div class="spacer"></div>
    <a id="docs" href="https://open-data-for-iran.github.io/HIESIR-Codebook/">Docs</a>
    <button id="lang" type="button">فارسی</button>
    <button id="theme" type="button" title="Light / dark">◐</button>
  </div>
</header>
<main>
  <div class="hx hx-standalone" data-root="../" data-pdf="https://open-data-for-iran.github.io/HIESIR-Codebook/pdf/"></div>
</main>
<script>
(function () {
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var lang = new URLSearchParams(location.search).get("lang") || store.get("hx-lang") || "en";
  var fa = lang === "fa";
  document.documentElement.lang = lang;
  document.documentElement.dir = fa ? "rtl" : "ltr";
  document.querySelector(".hx").dataset.lang = lang;
  document.getElementById("brand").textContent = fa ? "راهنمای کدهای هزینه و درآمد خانوار" : "HIESIR Codebook";
  var docs = document.getElementById("docs"); docs.textContent = fa ? "مستندات" : "Docs"; if (fa) docs.href += "fa/";
  var btn = document.getElementById("lang");
  btn.textContent = fa ? "English" : "فارسی";
  btn.onclick = function () { store.set("hx-lang", fa ? "en" : "fa"); location.search = "?lang=" + (fa ? "en" : "fa"); };
  var th = store.get("hx-theme"); if (th) document.documentElement.dataset.theme = th;
  document.getElementById("theme").onclick = function () {
    var d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    d.dataset.theme = dark ? "light" : "dark"; store.set("hx-theme", d.dataset.theme);
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && window.HX) { e.preventDefault(); window.HX[0].focus(); }
  });
})();
</script>
<script>window.HX_DATA = /*__DATA__*/null;</script>
<script>
/*__JS__*/
</script>
</body>
</html>
